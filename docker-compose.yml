services:
  postgres:
    image: postgres:16
    container_name: hr_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/staging/01_create_staging_schema.sql:/docker-entrypoint-initdb.d/01_staging.sql:ro
      - ./sql/warehouse/01_create_warehouse_schema.sql:/docker-entrypoint-initdb.d/02_warehouse.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: hr_etl_app
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

    volumes:
      - .:/app

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: